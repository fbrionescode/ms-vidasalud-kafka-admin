spring.application.name=ms-vidasalud-kafka-admin
server.port=${SERVER_PORT:8085}

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP:localhost:9092,localhost:9093,localhost:9094}

vidasalud.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP:localhost:9092,localhost:9093,localhost:9094}
vidasalud.kafka.request-timeout-ms=5000
vidasalud.kafka.topico-atenciones=vidasalud.atenciones.eventos
vidasalud.kafka.topico-atenciones-dlt=vidasalud.atenciones.eventos.DLT
vidasalud.kafka.topico-boxes=vidasalud.boxes.estado
vidasalud.kafka.topico-boxes-dlt=vidasalud.boxes.estado.DLT
vidasalud.kafka.particiones=3
vidasalud.kafka.replicas=3
vidasalud.kafka.min-insync-replicas=2
vidasalud.kafka.retencion-atenciones-ms=604800000
vidasalud.kafka.segment-boxes-ms=600000

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
